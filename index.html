<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Party Games</title>
  <meta name="description" content="Central de jogos de festa para jogar no navegador.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
</head>
<body>
  <main class="container">
    <header class="hub-hero stack">
      <h1>Party <span class="brand"><span>Games</span></span></h1>
      <p class="muted">Tabuleiros, dados e timers para jogar com a galera, direto no navegador.</p>
    </header>

    <div class="hub-grid">
      <a class="card game-card" href="games/desenho/">
        <div class="art" aria-hidden="true">
          <svg viewBox="0 0 120 60">
            <g fill="var(--surface)" stroke="var(--accent)" stroke-width="1.5">
              <polygon points="20,12 29,17 29,27 20,32 11,27 11,17" />
              <polygon points="38,12 47,17 47,27 38,32 29,27 29,17" fill="var(--accent)" />
              <polygon points="56,12 65,17 65,27 56,32 47,27 47,17" />
              <polygon points="74,12 83,17 83,27 74,32 65,27 65,17" fill="var(--violet-soft)" stroke="var(--violet)" />
              <polygon points="92,12 101,17 101,27 92,32 83,27 83,17" />
              <polygon points="101,28 110,33 110,43 101,48 92,43 92,33" fill="var(--accent)" />
            </g>
            <circle cx="56" cy="22" r="4" fill="var(--violet)" />
            <path d="M14 50 q10 -10 20 0 t20 0 t20 0" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" />
          </svg>
        </div>
        <h2>Rabisco &amp; Adivinha</h2>
        <p class="muted">Desenhe ou faça mímica para sua equipe adivinhar. Tabuleiro, dado de categoria, dado de casas e timer.</p>
        <ul class="tags">
          <li>Equipes</li>
          <li>4+ jogadores</li>
          <li>Use suas cartas</li>
        </ul>
      </a>

      <div class="card game-card soon">
        <div class="art" aria-hidden="true">?</div>
        <h2>Em breve</h2>
        <p class="muted">Mais tabuleiros a caminho.</p>
      </div>
    </div>
  </main>
</body>
</html>
